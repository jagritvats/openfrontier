name: site

# Rebuilds the public record from scratch on every push to main: the seeds
# re-run every certificate through the real oracle, so the deployed site's
# "checked" badges were earned in CI, not asserted by hand.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python problems/erdos-straus/seed.py --fresh
      - run: python problems/collatz/seed.py
      - run: python -m openfrontier site --out site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
